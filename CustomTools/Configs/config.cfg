# CustomTools 统一配置 v2
# 格式：key = value
# 重复 key 组成列表；映射用 key = mapKey | mapValue
# value 保留首尾空格；# 开头为注释

version = 2
# 视频查重
video.fps = 2
video.threshold = 30
video.parallelism = 6
video.keyframeSampling = true
# 硬件解码：auto/cuda/qsv/amf/dxva2/none，默认关闭，失败会自动回退 CPU
video.hwaccel = none
# 时长容差（秒）
video.durationTolerance = 10


